<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment complete | AutismReady</title><link rel="stylesheet" href="/css/styles.css?v=32"></head><body><header class="nav"><a class="brand" href="/">Autism<span>Ready</span></a></header><main class="builder" style="max-width:900px;margin:auto;min-height:65vh"><div class="section-head"><span>SECURE CHECKOUT</span><h1 id="title">Verifying your payment…</h1></div><p id="message">Please keep this page open while AutismReady confirms your purchase.</p><div id="actions"></div><div id="pack"></div></main><footer><a class="brand" href="/">Autism<span>Ready</span></a><p>Personalized preparation for everyday experiences.</p></footer><script>
(async function(){
const title=document.getElementById("title"),msg=document.getElementById("message"),actions=document.getElementById("actions"),pack=document.getElementById("pack"),id=new URLSearchParams(location.search).get("session_id");
if(!id){title.textContent="We could not verify this checkout";msg.textContent="No checkout session was provided. Your Ready Pack has not been unlocked.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>';return}
try{const r=await fetch("/api/verify-checkout?session_id="+encodeURIComponent(id),{cache:"no-store"});const d=await r.json();if(d.paid){title.textContent="Your Ready Pack is unlocked";msg.textContent="Your checkout has been verified. Review your complete Ready Pack below, then print or save it as a PDF.";actions.innerHTML='<button type="button" class="primary" onclick="window.print()">Print / Save PDF</button> <a class="secondary" href="/">Build another</a><p class="print-tip">For a clean PDF, turn off <b>Headers and footers</b> in your browser print settings.</p>';let m=null;try{m=JSON.parse(sessionStorage.getItem("autismready_pack")||"null")}catch(e){}if(!m){msg.textContent="Payment is verified, but this browser no longer has the Ready Pack details. Return to AutismReady in this same browser to build the pack again.";return}pack.innerHTML=renderPack(m)}else throw new Error()}catch(e){title.textContent="Payment verification is not complete";msg.textContent="We could not confirm the payment from this page. Please do not submit another payment until you check your Stripe receipt.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>'}
})();

function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iconFor(title){var t=String(title||"").toLowerCase(),id="custom";if(/travel|car|arrive/.test(t))id="travel";else if(/clipper|scissor|hair|cut/.test(t))id="haircut";else if(/cape/.test(t))id="cape";else if(/dryer|sound|buzz/.test(t))id="sound";else if(/mirror|look/.test(t))id="mirror";else if(/finish|leave|done/.test(t))id="done";else if(/wait/.test(t))id="wait";else if(/chair|sit/.test(t))id="chair";else if(/meet|greet|people/.test(t))id="people";else if(/check|doctor|dentist|exam/.test(t))id="care";return '<span class="step-pictogram '+id+'" aria-hidden="true"></span>'}
function commIcon(v){var k=String(v||"").toLowerCase().replace(/\s+/g,"-");return '<span class="comm-symbol comm-'+e(k)+'" aria-hidden="true"></span>'}
function cleanStory(x){var t=String(x.text||"");if(/^I can learn about travel to/i.test(t))return "I will travel to "+String(x.title||"").replace(/^Travel to /i,"")+". I can bring things that help me feel ready.";return t}
function renderPack(m){function stories(){return(m.steps||[]).map(x=>'<article class="pack-story-step visual-step">'+iconFor(x.title)+'<div class="step-number">'+e(x.number)+'</div><div><b>'+e(x.title)+'</b><p>'+e(cleanStory(x))+'</p></div></article>').join("")}
var first=m.schedule&&m.schedule[0]?m.schedule[0].title:m.display;
var cards=(m.cards||[]).map(x=>'<div class="communication-card">'+commIcon(x)+'<strong>'+e(x)+'</strong></div>').join("");
return '<div class="full-ready-pack">'+
'<section class="pack-page pack-title-page"><div class="pack-mark">Autism<span>Ready</span></div><img class="pack-scene" src="/assets/scenes/'+e(m.scene)+'.svg?v=1" alt=""><span class="section-label">PERSONALIZED READY PACK</span><h1>'+e(m.name)+'’s '+e(m.display)+' Ready Pack</h1><p>'+e(m.when)+'</p><div class="pack-purpose"><b>Preparation goal</b><p>'+e(m.goal)+'</p></div></section>'+
'<section class="pack-page story-page"><span class="section-label">MY VISUAL PREPARATION STORY</span><h2>What may happen</h2><div class="pack-story-list">'+stories()+'</div></section>'+
'<section class="pack-page schedule-page"><span class="section-label">MY VISUAL SCHEDULE</span><h2>What comes next</h2><p class="pack-instruction">Point to each step as it happens. Check it off when it is finished.</p><div class="schedule-grid visual-schedule">'+(m.schedule||[]).map(x=>'<div>'+iconFor(x.title)+'<b>'+e(x.number)+'</b><span>'+e(x.title)+'</span><i aria-hidden="true">✓</i></div>').join("")+'</div></section>'+
'<section class="pack-page tools-page"><span class="section-label">MY COMMUNICATION TOOLS</span><h2>Ways I can communicate</h2><div class="communication-card-grid">'+cards+'</div><div class="first-then-block"><span class="section-label">FIRST / THEN</span><div class="first-then-grid"><div>'+iconFor(first)+'<small>FIRST</small><strong>'+e(first)+'</strong></div><div><span class="step-pictogram preferred" aria-hidden="true"></span><small>THEN</small><strong>'+e(m.then)+'</strong></div></div></div></section>'+
'<section class="pack-page support-page"><span class="section-label">SENSORY PREPARATION</span><h2>What I may notice & what helps</h2><div class="pack-info-grid"><article><b>I may notice</b><p>'+e(m.sensory)+'</p></article><article><b>Supports that may help</b><p>'+e(m.supports)+'</p></article><article><b>Please avoid when possible</b><p>'+e(m.avoid)+'</p></article><article><b>Other things that help</b><p>'+e(m.helps)+'</p></article></div><div class="support-divider"></div><span class="section-label">HOW TO SUPPORT ME</span><h2 class="support-title">Quick guide for '+e(m.name)+'</h2><div class="handoff-compact"><div><b>Communication</b><p>'+e(m.communication)+'</p></div><div><b>Language & processing</b><p>'+e(m.language)+' • '+e(m.communicationNotes)+'</p></div><div><b>Boundaries & break signals</b><p>'+e(m.signals)+'</p></div><div><b>Sensory / environment</b><p>'+e(m.sensory)+'</p></div><div><b>What helps</b><p>'+e(m.supports)+' • '+e(m.helps)+'</p></div><div><b>Please avoid when possible</b><p>'+e(m.avoid)+'</p></div></div></section>'+
'</div>'}
</script></body></html>
