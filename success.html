<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment complete | AutismReady</title><link rel="stylesheet" href="/css/styles.css?v=24"></head><body><header class="nav"><a class="brand" href="/">Autism<span>Ready</span></a></header><main class="builder" style="max-width:900px;margin:auto;min-height:65vh"><div class="section-head"><span>SECURE CHECKOUT</span><h1 id="title">Verifying your payment…</h1></div><p id="message">Please keep this page open while AutismReady confirms your purchase.</p><div id="actions"></div><div id="pack"></div></main><footer><a class="brand" href="/">Autism<span>Ready</span></a><p>Personalized preparation for everyday experiences.</p></footer><script>
(async function(){
const title=document.getElementById("title"),msg=document.getElementById("message"),actions=document.getElementById("actions"),pack=document.getElementById("pack"),id=new URLSearchParams(location.search).get("session_id");
if(!id){title.textContent="We could not verify this checkout";msg.textContent="No checkout session was provided. Your Ready Pack has not been unlocked.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>';return}
try{const r=await fetch("/api/verify-checkout?session_id="+encodeURIComponent(id),{cache:"no-store"});const d=await r.json();if(d.paid){title.textContent="Your Ready Pack is unlocked";msg.textContent="Your checkout has been verified. Review your complete Ready Pack below, then print or save it as a PDF.";actions.innerHTML='<button type="button" class="primary" onclick="window.print()">Print / Save PDF</button> <a class="secondary" href="/">Build another</a>';let m=null;try{m=JSON.parse(sessionStorage.getItem("autismready_pack")||"null")}catch(e){}if(!m){msg.textContent="Payment is verified, but this browser no longer has the Ready Pack details. Return to AutismReady in this same browser to build the pack again.";return}pack.innerHTML=renderPack(m)}else throw new Error()}catch(e){title.textContent="Payment verification is not complete";msg.textContent="We could not confirm the payment from this page. Please do not submit another payment until you check your Stripe receipt.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>'}
})();

function e(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function renderPack(m){function stories(){return(m.steps||[]).map(x=>'<article class="pack-story-step"><div class="step-number">'+e(x.number)+'</div><div><b>'+e(x.title)+'</b><p>'+e(x.text)+'</p></div></article>').join("")}return '<div class="full-ready-pack"><section class="pack-page pack-title-page"><div class="pack-mark">Autism<span>Ready</span></div><svg class="pack-scene" viewBox="0 0 120 82"><use href="/assets/experience-scenes.svg#'+e(m.scene)+'"></use></svg><span class="section-label">PERSONALIZED READY PACK</span><h1>'+e(m.name)+'’s '+e(m.display)+' Ready Pack</h1><p>'+e(m.when)+'</p><div class="pack-purpose"><b>Preparation goal</b><p>'+e(m.goal)+'</p></div></section><section class="pack-page"><span class="section-label">MY VISUAL PREPARATION STORY</span><h2>What may happen</h2><div class="pack-story-list">'+stories()+'</div></section><section class="pack-page"><span class="section-label">MY VISUAL SCHEDULE</span><h2>What comes next</h2><div class="schedule-grid">'+(m.schedule||[]).map(x=>'<div><b>'+e(x.number)+'</b><span>'+e(x.title)+'</span></div>').join("")+'</div></section><section class="pack-page"><span class="section-label">MY COMMUNICATION CARDS</span><h2>Ways I can communicate</h2><div class="communication-card-grid">'+(m.cards||[]).map(x=>'<div class="communication-card"><strong>'+e(x)+'</strong></div>').join("")+'</div></section><section class="pack-page"><span class="section-label">FIRST / THEN</span><h2>One step at a time</h2><div class="first-then-grid"><div><small>FIRST</small><strong>'+e(m.schedule&&m.schedule[0]?m.schedule[0].title:m.display)+'</strong></div><div><small>THEN</small><strong>'+e(m.then)+'</strong></div></div></section><section class="pack-page"><span class="section-label">SENSORY PREPARATION</span><h2>What I may notice & what helps</h2><div class="pack-info-grid"><article><b>I may notice</b><p>'+e(m.sensory)+'</p></article><article><b>Supports that may help</b><p>'+e(m.supports)+'</p></article><article><b>Please avoid when possible</b><p>'+e(m.avoid)+'</p></article><article><b>Other things that help</b><p>'+e(m.helps)+'</p></article></div></section><section class="pack-page support-handoff"><span class="section-label">HOW TO SUPPORT ME</span><h2>Quick guide for '+e(m.name)+'</h2><div class="handoff-row"><b>Communication</b><p>'+e(m.communication)+'</p></div><div class="handoff-row"><b>Language & processing</b><p>'+e(m.language)+' • '+e(m.communicationNotes)+'</p></div><div class="handoff-row"><b>Boundaries & break signals</b><p>'+e(m.signals)+'</p></div><div class="handoff-row"><b>Sensory / environment</b><p>'+e(m.sensory)+'</p></div><div class="handoff-row"><b>What helps</b><p>'+e(m.supports)+' • '+e(m.helps)+'</p></div><div class="handoff-row"><b>Please avoid when possible</b><p>'+e(m.avoid)+'</p></div></section></div>'}
</script></body></html>
