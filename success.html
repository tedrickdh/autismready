<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment complete | AutismReady</title><link rel="stylesheet" href="/css/styles.css?v=20"></head><body><header class="nav"><a class="brand" href="/">Autism<span>Ready</span></a></header><main class="builder" style="max-width:760px;margin:auto;min-height:65vh"><div class="section-head"><span>SECURE CHECKOUT</span><h1 id="title">Verifying your payment…</h1></div><p id="message">Please keep this page open while AutismReady confirms your purchase.</p><div id="actions"></div></main><footer><a class="brand" href="/">Autism<span>Ready</span></a><p>Personalized preparation for everyday experiences.</p></footer><script>
(async function(){
const title=document.getElementById("title"),msg=document.getElementById("message"),actions=document.getElementById("actions"),id=new URLSearchParams(location.search).get("session_id");
if(!id){title.textContent="We could not verify this checkout";msg.textContent="No checkout session was provided. Your Ready Pack has not been unlocked.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>';return}
try{const r=await fetch("/api/verify-checkout?session_id="+encodeURIComponent(id),{cache:"no-store"});const d=await r.json();if(d.paid){title.textContent="Payment confirmed";msg.textContent="Your $7.99 AutismReady purchase has been verified. Your complete Ready Pack delivery is being connected next.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>'}else throw new Error()}catch(e){title.textContent="Payment verification is not complete";msg.textContent="We could not confirm the payment from this page. Please do not submit another payment until you check your Stripe receipt.";actions.innerHTML='<a class="primary" href="/">Return to AutismReady</a>'}
})();
</script></body></html>
